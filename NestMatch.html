<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NestMatch — Find your perfect home in Europe</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: #111009;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    #root { height: 100%; }
    input, button, textarea { font-family: 'DM Sans', sans-serif; }
    input::placeholder { color: #A8A29E; }
    ::-webkit-scrollbar { width: 0; height: 0; }

    @keyframes confettiFall {
      0%   { transform: translateY(-20px) rotate(0deg); opacity: 1; }
      100% { transform: translateY(130vh) rotate(720deg); opacity: 0; }
    }
    @keyframes nmSlideUp {
      from { transform: translateY(24px); opacity: 0; }
      to   { transform: translateY(0);    opacity: 1; }
    }
    @keyframes nmPop {
      0%   { transform: scale(0.93); opacity: 0; }
      100% { transform: scale(1);    opacity: 1; }
    }
    @keyframes nmFadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
    .nm-fade  { animation: nmFadeIn  0.25s ease both; }
    .nm-pop   { animation: nmPop     0.35s cubic-bezier(0.175,0.885,0.32,1.2) both; }
    .nm-slide { animation: nmSlideUp 0.32s ease both; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js"
    integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L"
    crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"
    integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm"
    crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"
    integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y"
    crossorigin="anonymous"></script>

  <script type="text/babel" src="ios-frame.jsx"></script>
  <script type="text/babel" src="nm-components.jsx"></script>
  <script type="text/babel" src="nm-app.jsx"></script>
</body>
</html>
